[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "logger"
version = "1.0.0"
description = "Structured logging framework with DI, queue pipeline, rotation, RabbitMQ and OpenTelemetry"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Evan Flores", email = "e2002florespulido@gmail.com" }]
keywords = [
    "logging", "structured-logging", "opentelemetry", "rabbitmq",
    "tracing", "async", "queue-handler",
]
dependencies = [
    "pydantic>=2.12",
    "pydantic-settings>=2.0",
    "colorlog>=6.7",
    "python-dotenv>=1.0",
    "aiofiles>=24.1",
]

[project.optional-dependencies]
amqp = [
    "pika>=1.3",
    "aio-pika>=9.4"
]

otel = [
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-instrumentation-logging>=0.48b0",
]

dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6",
    "freezegun>=1.5",
    "testcontainers>=4.8",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.urls]
Homepage = "https://github.com/EvanFloresLv/Logger.git"
Repository = "https://github.com/EvanFloresLv/Logger.git"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["logger*"]